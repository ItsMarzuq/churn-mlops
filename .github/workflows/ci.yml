name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e .
      - name: Create CI model
        run: python scripts/make_ci_model.py
      - name: Build image
        run: docker build -t churn-api:ci .
      - name: Run container
        run: docker run -d --name api -p 8000:8000 churn-api:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"model_loaded":true'; then
              echo "health ok"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"model_loaded":true'
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No","tenure":2,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"No","StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":70.7,"TotalCharges":151.65}'
      - name: Container logs on failure
        if: failure()
        run: docker logs api